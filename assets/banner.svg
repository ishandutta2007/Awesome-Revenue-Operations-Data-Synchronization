<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.4)" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes pulseOrb {
      0% { r: 120px; opacity: 0.2; }
      50% { r: 145px; opacity: 0.38; }
      100% { r: 120px; opacity: 0.2; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes syncPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #38bdf8); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 12px #818cf8); }
    }

    .p-1 { animation: floatParticle 6s ease-in-out infinite; }
    .p-2 { animation: floatParticle 8s ease-in-out infinite 1.5s; }
    .p-3 { animation: floatParticle 7s ease-in-out infinite 3s; }
    .orb-glow { animation: pulseOrb 8s ease-in-out infinite; }
    .flowing-sync { stroke-dasharray: 8 8; animation: flowLine 4s linear infinite; }
    .node-pulse { animation: syncPulse 3s ease-in-out infinite; transform-origin: center; }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #e2e8f0;
      letter-spacing: 0.6px;
    }
  </style>

  <!-- Deep Canvas Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Dynamic Ambient Glows (Strictly in Background) -->
  <circle cx="200" cy="80" r="130" fill="#38bdf8" class="orb-glow" filter="url(#softGlow)" />
  <circle cx="1050" cy="280" r="140" fill="#818cf8" class="orb-glow" filter="url(#softGlow)" />
  <circle cx="950" cy="80" r="100" fill="#c084fc" class="orb-glow" filter="url(#softGlow)" />

  <!-- Grid Pattern Overlay in Background -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Dynamic Data Flow Illustration (Right Column - Non-obstructive) -->
  <g transform="translate(850, 65)">
    <!-- Architectural Connector Paths -->
    <path d="M 50 60 C 130 60, 130 140, 210 140" fill="none" stroke="#334155" stroke-width="2.5" />
    <path d="M 50 60 C 130 60, 130 140, 210 140" fill="none" stroke="#38bdf8" stroke-width="2.5" class="flowing-sync" opacity="0.9" />

    <path d="M 50 200 C 130 200, 130 140, 210 140" fill="none" stroke="#334155" stroke-width="2.5" />
    <path d="M 50 200 C 130 200, 130 140, 210 140" fill="none" stroke="#818cf8" stroke-width="2.5" class="flowing-sync" opacity="0.9" />

    <path d="M 210 140 L 270 140" fill="none" stroke="#c084fc" stroke-width="2.5" class="flowing-sync" />

    <!-- Source Node 1: Warehouse / Lakehouse -->
    <g transform="translate(0, 30)">
      <rect width="90" height="56" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" filter="url(#glow)" />
      <text x="45" y="32" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#e0f2fe">WAREHOUSE</text>
      <text x="45" y="47" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#38bdf8">Source of Truth</text>
    </g>

    <!-- Source Node 2: Multi-directional CRM -->
    <g transform="translate(0, 170)">
      <rect width="90" height="56" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" filter="url(#glow)" />
      <text x="45" y="32" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#e0e7ff">CRM / GTM</text>
      <text x="45" y="47" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#818cf8">Bi-Directional</text>
    </g>

    <!-- Central Node: Sync Engine / Reverse ETL -->
    <g transform="translate(165, 108)" class="node-pulse">
      <rect width="90" height="64" rx="12" fill="#0f172a" stroke="url(#primaryGlow)" stroke-width="2" filter="url(#glow)" />
      <text x="45" y="34" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff">REVOPS SYNC</text>
      <text x="45" y="50" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="600" fill="#38bdf8">Reverse ETL</text>
    </g>

    <!-- Target Node: Destination / Action Tools -->
    <g transform="translate(250, 114)">
      <circle cx="28" cy="26" r="24" fill="url(#emeraldGrad)" opacity="0.2" />
      <circle cx="28" cy="26" r="18" fill="#0f172a" stroke="#34d399" stroke-width="2" />
      <text x="28" y="30" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399">ACT</text>
    </g>
  </g>

  <!-- Subtle Floating Particles in Background -->
  <circle cx="340" cy="90" r="3" fill="#38bdf8" class="p-1" />
  <circle cx="680" cy="70" r="2.5" fill="#c084fc" class="p-2" />
  <circle cx="790" cy="270" r="3.5" fill="#818cf8" class="p-3" />
  <circle cx="160" cy="280" r="2" fill="#38bdf8" class="p-1" />

  <!-- FOREGROUND CONTENT: Header & Meta (Guaranteed Legible & Prominent) -->
  <g transform="translate(75, 75)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="250" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="14" cy="14" r="5" fill="#38bdf8" />
      <text x="28" y="18" class="badge-text" fill="#38bdf8">REVENUE DATA INFRASTRUCTURE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" class="title-text" font-size="40">Awesome Revenue Operations</text>
    <text x="0" y="126" class="title-text" font-size="34" fill="url(#primaryGlow)">Data Synchronization Ecosystem</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="170" class="subtitle-text" font-size="16">
      Curated guide to Reverse ETL, bi-directional sync, real-time activation,
    </text>
    <text x="0" y="194" class="subtitle-text" font-size="16">
      and modern warehouse-native GTM pipelines.
    </text>

    <!-- Tech Indicator Badges -->
    <g transform="translate(0, 224)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="120" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="60" y="17" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">Reverse ETL</text>

      <!-- Badge 2 -->
      <rect x="130" y="0" width="140" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="200" y="17" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">Multi-Directional</text>

      <!-- Badge 3 -->
      <rect x="280" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="345" y="17" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">Open-Source Core</text>

      <!-- Badge 4 -->
      <rect x="420" y="0" width="120" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="480" y="17" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">GTM Activation</text>
    </g>
  </g>
</svg>
