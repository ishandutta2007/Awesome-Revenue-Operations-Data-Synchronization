<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/><stop offset="100%" stop-color="rgba(15, 23, 42, 0.4)"/></linearGradient><linearGradient id="primaryGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cyanGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/></linearGradient><linearGradient id="emeraldGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#059669"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="softGlow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="15"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.3}50%{transform:translateY(-15px) translateX(10px);opacity:.8}}@keyframes pulseOrb{0%{r:120px;opacity:.2}50%{r:145px;opacity:.38}}@keyframes flowLine{0%{stroke-dashoffset:200}}@keyframes syncPulse{0%{transform:scale(1);filter:drop-shadow(0 0 4px #38bdf8)}50%{transform:scale(1.08);filter:drop-shadow(0 0 12px #818cf8)}}.p-1{animation:floatParticle 6s ease-in-out infinite}.p-2{animation:floatParticle 8s ease-in-out infinite 1.5s}.p-3{animation:floatParticle 7s ease-in-out infinit